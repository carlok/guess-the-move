# Dev stack for rootless podman:  podman compose up --build      (or: podman-compose up --build)
#   web      static app on http://127.0.0.1:8080, with ./web/data mounted over the baked demo data
#   builder  one-shot dataset build, only under the "build" profile:
#            podman compose --profile build run --rm builder --pgn /in/games.pgn.zst --out /out/positions.json --maia none
# `make` wraps the same commands with plain podman (no compose provider needed).
# :Z relabels bind mounts for SELinux; harmless elsewhere.
name: guess-the-move

services:
  web:
    build:
      context: .
      dockerfile: containers/web/Containerfile
    image: localhost/gtm-web:dev
    ports:
      - "127.0.0.1:8080:8080"
    volumes:
      - ./web/data:/usr/share/nginx/html/data:ro,Z
    read_only: true
    tmpfs:
      - /tmp
      - /etc/nginx/conf.d:rw,mode=1777   # the entrypoint renders the nginx template here
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/healthz"]
      interval: 30s
      timeout: 3s
    restart: unless-stopped

  builder:
    profiles: ["build"]
    build:
      context: .
      dockerfile: containers/builder/Containerfile
      args:
        WITH_MAIA: "0"
    image: localhost/gtm-builder:dev
    volumes:
      - ./data:/in:ro,Z
      - ./web/data:/out:Z

  # The api is optional: `podman compose --profile api up --build`. It is not published to the host; the web container
  # reaches it at http://api:8000 and exposes it to the browser as /api/. Maia's weights live in the gtm-models volume
  # (run `make api-weights` once); without them, set GTM_API_MAIA=none.
  api:
    profiles: ["api"]
    build:
      context: .
      dockerfile: containers/api/Containerfile
      args:
        WITH_MAIA: "1"
        MAIA_MODE: maia3
    image: localhost/gtm-api:maia
    environment:
      GTM_API_TRUST_PROXY: "1"
      GTM_API_ENGINES: "2"
      VALKEY_URL: ""           # set to redis://valkey:6379 together with --profile cache
    volumes:
      - gtm-models:/models
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    cpus: 2
    mem_limit: 2g
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://127.0.0.1:8000/healthz')"]
      interval: 30s
      timeout: 5s
    restart: unless-stopped

  # Optional shared analysis cache (Valkey, BSD, speaks the Redis protocol). The api works without it.
  valkey:
    profiles: ["cache"]
    image: docker.io/valkey/valkey:8-alpine
    command: ["valkey-server", "--save", "", "--appendonly", "no", "--maxmemory", "128mb", "--maxmemory-policy", "allkeys-lru"]
    read_only: true
    tmpfs:
      - /tmp
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    mem_limit: 256m

volumes:
  gtm-models:
