# nginx config for the Guess the Move web image (nginxinc/nginx-unprivileged: listens on 8080, non-root).
# Content-Security-Policy is the single source of truth for the app's needs: the app uses only
# same-origin files, no inline script and no inline style="" attributes. tests/test_containers.py
# checks it (one add_header line, no unsafe-inline), so keep it on ONE line.
server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # NOTE: add_header in a `location` block would REPLACE these (nginx inheritance rule), so
    # the headers live only here and locations use `expires` instead.
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;

    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The dataset changes whenever the builder is re-run: always revalidate.
    location /data/ {
        expires -1;
    }

    location / {
        expires -1;  # no build step, so no fingerprinted file names: revalidate (ETag) instead of risking an old app.js beside a new index.html
        try_files $uri $uri/ =404;
    }

    # --- API service (optional) ---------------------------------------------------------------------------------
    # The api container is a separate service. nginx must start without it, so the upstream is a variable resolved at
    # request time through the container's own DNS server (NGINX_LOCAL_RESOLVERS, filled in by the image's entrypoint
    # from /etc/resolv.conf). Without an `api` host a request to /api/ answers 502 and the front end treats that as
    # "no API". The proxy sets X-Forwarded-For itself ($remote_addr, never appended to a client-supplied value), because
    # the api trusts it for its per-client rate limit. No add_header here (it would drop the security headers above).
    # /api/healthz is how the front end detects the api. When there is none it answers 200 {"status":"unavailable"} rather
    # than 502, because browsers log every non-2xx response as a console error and the page must stay silent without an api.
    location = /api/healthz {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_connect_timeout 1s;
        proxy_read_timeout 3s;
        error_page 502 503 504 = @api_unavailable;
        expires -1;
    }
    location @api_unavailable {
        default_type application/json;
        return 200 '{"status":"unavailable"}';
    }

    location /api/ {
        resolver ${NGINX_LOCAL_RESOLVERS} valid=10s ipv6=off;
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $api_upstream;
        proxy_set_header Host $http_host;  # with the port: the api compares it with the Origin header
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;
        client_max_body_size 64k;
        expires -1;
    }
}
