name: Report a bug
description: Something in the app does not work as described (not a security issue — see SECURITY.md).
labels: ["bug"]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: where
    attributes:
      label: Browser, device, and how you opened the app
      placeholder: "Safari on iPhone, installed from https://..., or `make run`"
  - type: textarea
    id: console
    attributes:
      label: Console messages
      description: Open the browser's developer tools and paste any red messages.
      render: text
