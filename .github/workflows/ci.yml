# Continuous integration. Deliberately thin: every step is a `make` target that also runs on a developer machine, so
# `make ci` locally is the same thing in the same order (see README, "Continuous integration").
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: make coverage-python

  web:
    name: Web tests, coverage and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make coverage-js
      - run: npm test  # includes the slow test that clicks the best move of every shipped position
        working-directory: web
      - name: Chrome for the browser tests
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: make lighthouse-check  # Lighthouse (mobile) on the real build; fails below the budgets in tools/lighthouse_check.js
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: lighthouse-report
          path: test-results/lighthouse-report.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  containers:
    name: Container images build and answer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - run: podman --version
      - run: make containers-check
