# Continuous integration. Deliberately thin: every step is a `make` target that also runs on a developer machine, so
# `make ci` locally is the same thing in the same order (see README, "Continuous integration").
name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests and coverage
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      PYTHON: python
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements*.txt
      - run: pip install -r requirements-dev.txt
      - run: make coverage-python

  web:
    name: Web tests, coverage and browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: make coverage-js
      - run: npm test  # includes the slow test that clicks the best move of every shipped position
        working-directory: web
      - name: Chrome for the browser tests
        run: command -v google-chrome >/dev/null || npx playwright install --with-deps chrome
        working-directory: web
      - run: npx playwright test
        working-directory: web
      - run: make pages-check  # the GitHub Pages build, served like a host with no headers and no api, also under /guess-the-move/
      - run: make lighthouse-check  # Lighthouse (mobile) on the real build; fails below the budgets in tools/lighthouse_check.js
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: lighthouse-report
          path: test-results/lighthouse-report.json
          retention-days: 7
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces
          path: web/test-results
          retention-days: 7

  # The same browser specs in Firefox and WebKit (Safari's engine). Playwright retries a failing test once in these projects.
  other-browsers:
    name: Firefox and WebKit browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
        working-directory: web
      - run: npx playwright install --with-deps firefox webkit
        working-directory: web
      - run: make other-browsers
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-traces-other-browsers
          path: web/test-results
          retention-days: 7

  containers:
    name: Container images build and answer
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - run: podman --version
      - run: make containers-check

  # GitHub Pages: https://carlok.github.io/guess-the-move/. Only after every other job passed, only for a push to main. `make pages-check`
  # (in the web job) has already run the browser tests on this commit's Pages build; this job builds it again from the same sources.
  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [python, web, other-browsers, containers]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - run: make pages
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist-pages
      - id: deployment
        uses: actions/deploy-pages@v5
