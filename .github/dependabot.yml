# Weekly dependency updates. Review PRs like any other change: tests and coverage must stay green.
version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      python-dev:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      python-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      npm-web-minor-patch:
        patterns:
          - "*"
        update-types:
          - minor
          - patch
      npm-web-major:
        patterns:
          - "*"
        update-types:
          - major

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    groups:
      actions:
        patterns:
          - "*"
